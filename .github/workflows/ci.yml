name: CI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile is the vulnerability/source-of-truth gate. Suppress npm's
      # install-time audit/funding network calls here; they add time and can
      # fail independently of the deterministic build. Run dependency review
      # deliberately when dependencies change.
      - run: npm ci --no-audit --no-fund

      # One step, deliberately: `npm run verify` is the single definition of
      # "green", so what CI enforces and what a developer runs locally cannot
      # drift apart. Previously CI listed its own subset of checks and silently
      # omitted `npm run build`, check-importmap and check-dist — the last of
      # which had been failing its own 200 kB startup budget unnoticed
      # (AUDIT.md §4.2).
      - run: npm run verify
