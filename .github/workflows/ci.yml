name: CI

# Automatic runs are DISABLED — Actions minutes were the single biggest cost
# on this repo, and `npm run verify` is the same command a developer already
# runs locally before pushing (that equivalence is the whole point of the
# one-step job below), so the hosted run was buying very little.
#
# The job is kept, not deleted, so it can still be run on demand from the
# Actions tab ("Run workflow"). To put it back on every push/PR, restore:
#
#   on:
#     push:
#       branches: [main]
#     pull_request:
on:
  workflow_dispatch:

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # One step, deliberately: `npm run verify` is the single definition of
      # "green", so what CI enforces and what a developer runs locally cannot
      # drift apart. Previously CI listed its own subset of checks and silently
      # omitted `npm run build`, check-importmap and check-dist — the last of
      # which had been failing its own 200 kB startup budget unnoticed
      # (AUDIT.md §4.2).
      - run: npm run verify
