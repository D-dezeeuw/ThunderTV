name: Desktop build

# Catches electron-builder packaging regressions. Linux (AppImage) runs on
# every push/PR — cheapest CI minutes, and the target most likely to build
# cleanly headless. Windows (nsis/portable) and macOS (dmg) are gated to
# version tags only (masterplan Phase 29's "local-build, no signing infra"
# posture — burning full-matrix CI minutes on every push isn't worth it for
# a project that ships unsigned installers built and uploaded by hand
# anyway; a tag push is the actual release moment worth verifying on every
# OS).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  linux:
    name: package (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: desktop

      - name: package (AppImage)
        run: npm run package:linux
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: thundertv-linux
          path: release/*.AppImage
          retention-days: 7

  windows-macos:
    name: package (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: desktop

      - name: package (win)
        if: matrix.os == 'windows-latest'
        run: npm run package:win
        working-directory: desktop

      - name: package (mac)
        if: matrix.os == 'macos-latest'
        run: npm run package:mac
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: thundertv-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          retention-days: 7
