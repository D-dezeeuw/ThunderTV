name: Desktop build

# Catches electron-builder packaging regressions.
#
on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Also package Windows (nsis) and macOS (dmg), not just the Linux AppImage'
        type: boolean
        default: false

jobs:
  linux:
    name: package (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: desktop

      # Electron has no headless mode of its own, so the runner needs a real
      # X server for anything that opens a window.
      - name: install Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # Before packaging: the same millisecond-cheap module-graph check
      # `npm run verify` runs, so a broken files/extraResources allowlist
      # fails here in seconds rather than after a full package + launch.
      - run: npm run lint:desktop-package

      # Launch the app from a checkout. Catches "the shell doesn't boot" and
      # "the preload bridge changed shape" without waiting on electron-builder.
      - name: smoke (unpackaged)
        run: npm run smoke:desktop

      - name: package (AppImage)
        run: npm run package:linux
        working-directory: desktop

      # The one that would have caught the two bugs this job was added for:
      # both were invisible until the app ran from its *packaged* layout.
      # `--dir` output is what the AppImage is built from, so smoking it
      # tests the same file tree without mounting a FUSE image on CI.
      - name: smoke (packaged)
        run: |
          npx --yes --package=electron-builder@26.15.3 \
            electron-builder --config ../electron-builder.yml --linux dir
          cd .. && npm run smoke:desktop:packaged
        working-directory: desktop

      # The screenshots are the only way to see what a failed run looked
      # like — uploaded even on failure, for exactly that reason.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thundertv-smoke-screenshots
          path: release/smoke/*.png
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: thundertv-linux
          path: release/*.AppImage
          retention-days: 7

  windows-macos:
    name: package (${{ matrix.os }})
    # Off by default even on a manual run: Linux alone catches nearly every
    # packaging regression, and the Windows/macOS legs cost several times as
    # much per run. Tick `full_matrix` when cutting an actual release.
    if: inputs.full_matrix
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: desktop

      - name: package (win)
        if: matrix.os == 'windows-latest'
        run: npm run package:win
        working-directory: desktop

      - name: package (mac)
        if: matrix.os == 'macos-latest'
        run: npm run package:mac
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: thundertv-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          retention-days: 7
