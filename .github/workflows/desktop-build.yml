name: Desktop build

# Catches electron-builder packaging regressions.
#
on:
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Also package Windows (nsis) and macOS (dmg), not just the Linux AppImage'
        type: boolean
        default: false

jobs:
  linux:
    name: package (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: desktop

      - name: package (AppImage)
        run: npm run package:linux
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: thundertv-linux
          path: release/*.AppImage
          retention-days: 7

  windows-macos:
    name: package (${{ matrix.os }})
    # Off by default even on a manual run: Linux alone catches nearly every
    # packaging regression, and the Windows/macOS legs cost several times as
    # much per run. Tick `full_matrix` when cutting an actual release.
    if: inputs.full_matrix
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - run: npm ci

      - run: npm ci
        working-directory: desktop

      - name: package (win)
        if: matrix.os == 'windows-latest'
        run: npm run package:win
        working-directory: desktop

      - name: package (mac)
        if: matrix.os == 'macos-latest'
        run: npm run package:mac
        working-directory: desktop

      - uses: actions/upload-artifact@v4
        with:
          name: thundertv-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          retention-days: 7
