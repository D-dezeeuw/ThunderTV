<!doctype html>
<!--
  Lightweight startup splash (desktop/main.mjs): no framework, no JS, just
  the branding asset centered on the same dark background as the real
  window (`backgroundColor: '#0b0d10'` in main.mjs and tokens.css) so there
  is never a blank white/black flash before the real window is ready.
  `../dist/splash.png` is the build output path (public/splash.png is
  copied there by Vite) — this file is only ever loaded after `npm run
  build`, same as index.html.
-->
<html>
    <head>
        <meta charset="utf-8" />
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #0b0d10;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }
            img {
                width: 320px;
                max-width: 80%;
                -webkit-user-select: none;
                user-select: none;
                -webkit-user-drag: none;
            }
        </style>
    </head>
    <body>
        <img src="../dist/splash.png" alt="ThunderTV" draggable="false" />
    </body>
</html>
